server {
    listen 80;
    server_name resultados.intevopedi.org;
    root /usr/share/nginx/html;
    location = / {
        try_files /resultados.html =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
server {
    listen 80 default_server;
    server_name intevopedi.org www.intevopedi.org _;
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }
}
